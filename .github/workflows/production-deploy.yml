name: MarsField production deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from main to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to confirm the production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marsfield-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate confirmation and commit
        id: commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          test "$(git rev-parse "${REQUESTED_SHA}^{commit}")" = "$REQUESTED_SHA"
          test "$REQUESTED_SHA" = "$(git rev-parse origin/main)"
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MARSFIELD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MARSFIELD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy exact commit
        env:
          SSH_HOST: ${{ secrets.MARSFIELD_SSH_HOST }}
          SSH_PORT: ${{ secrets.MARSFIELD_SSH_PORT }}
          SSH_USER: ${{ secrets.MARSFIELD_SSH_USER }}
          TARGET_SHA: ${{ needs.validate.outputs.commit_sha }}
          PUBLIC_HEALTH_URL: ${{ vars.MARSFIELD_PUBLIC_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_HEALTH_URL"
          [[ "$PUBLIC_HEALTH_URL" =~ ^https://[A-Za-z0-9._~:/?#@%+=,\&-]+$ ]]
          printf -v REMOTE_COMMAND 'bash -s -- %q %q' "$TARGET_SHA" "$PUBLIC_HEALTH_URL"
          ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "$REMOTE_COMMAND" < scripts/deploy-production.sh

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marsfield}
      POSTGRES_USER: ${POSTGRES_USER:-marsfield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
      - backend/.env
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-marsfield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marsfield}?schema=public}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:?Set REPLICATE_API_TOKEN in .env}
      R2_BUCKET_URL: ${R2_BUCKET_URL:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      WEBHOOK_BASE_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      FRONTEND_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      RISK_SIGNAL_PEPPER: ${RISK_SIGNAL_PEPPER:?Set RISK_SIGNAL_PEPPER in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY in .env}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      FREE_TIER_DAILY_BUDGET_USD: ${FREE_TIER_DAILY_BUDGET_USD:-25}
      PLATFORM_DAILY_SAFETY_BUDGET_USD: ${PLATFORM_DAILY_SAFETY_BUDGET_USD:-500}
      GENERATION_COST_PER_CREDIT_USD: ${GENERATION_COST_PER_CREDIT_USD:-0.032}
      FREE_TRIAL_MAX_CREDITS_PER_JOB: ${FREE_TRIAL_MAX_CREDITS_PER_JOB:-5}
      FREE_TRIAL_MAX_VARIATIONS: ${FREE_TRIAL_MAX_VARIATIONS:-1}
      FREE_TRIAL_MAX_DURATION_SECONDS: ${FREE_TRIAL_MAX_DURATION_SECONDS:-10}
      FREE_TRIAL_DISABLED_WORKFLOWS: ${FREE_TRIAL_DISABLED_WORKFLOWS:-influencer-video,character-replace,video-edit,video-enhance}
      FREE_TRIAL_PHONE_RISK_THRESHOLD: ${FREE_TRIAL_PHONE_RISK_THRESHOLD:-50}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Set NEXT_PUBLIC_TURNSTILE_SITE_KEY in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
